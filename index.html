<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1714">
<title>Pustaka</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== VIEW: PERPUSTAKAAN ===== -->
<main id="view-library" class="view">
  <header class="lib-header">
    <div>
      <h1 class="brand">Pustaka</h1>
      <p class="tagline">Karya-karya besar, gratis &amp; legal.</p>
      <div class="lib-stats" id="lib-stats"></div>
    </div>
  </header>

  <section id="continue-card" class="continue-card" hidden></section>

  <a href="#/konstelasi" class="constellation-entry" id="constellation-entry">
    <span class="cx-entry-star">&#10022;</span>
    <span>Jelajahi Konstelasi Pengetahuan</span>
    <span class="cx-entry-go">&#8594;</span>
  </a>

  <div class="search-row">
    <div class="search-box">
      <span class="search-icon">&#128269;</span>
      <input type="text" id="search-input" placeholder="Cari judul atau penulis..." autocomplete="off">
      <button class="search-clear" id="search-clear" hidden aria-label="Bersihkan pencarian">&#10005;</button>
    </div>
  </div>

  <div class="group-toggle" id="group-toggle" role="tablist">
    <button class="gt-btn active" data-group="genre" role="tab">Genre</button>
    <button class="gt-btn" data-group="author" role="tab">Penulis</button>
  </div>

  <nav class="chips" id="category-chips" aria-label="Filter kategori"></nav>
  <div class="author-list" id="author-list" hidden></div>

  <section class="shelf" id="shelf" aria-live="polite"></section>

  <footer class="lib-footer">
    <p>Semua buku dari <strong>Project Gutenberg</strong> — domain publik, legal &amp; gratis.</p>
  </footer>
</main>

<!-- ===== VIEW: DETAIL BUKU ===== -->
<main id="view-detail" class="view" hidden>
  <header class="detail-topbar">
    <button class="icon-btn" id="detail-back" aria-label="Kembali">&#8592;</button>
  </header>
  <div id="detail-body"></div>
</main>

<!-- ===== VIEW: PROFIL PENULIS ===== -->
<main id="view-author" class="view author-view" hidden>
  <header class="detail-topbar">
    <button class="icon-btn" id="author-back" aria-label="Kembali">&#8592;</button>
  </header>
  <div id="author-body"></div>
</main>

<!-- ===== VIEW: KONSTELASI PENGETAHUAN ===== -->
<main id="view-constellation" class="view constellation-view" hidden>
  <header class="detail-topbar">
    <button class="icon-btn" id="constellation-back" aria-label="Kembali">&#8592;</button>
  </header>
  <div id="constellation-body"></div>
</main>

<!-- ===== VIEW: PEMBACA ===== -->
<main id="view-reader" class="view reader" hidden>
  <div class="reader-progress"><div id="reader-progress-fill"></div></div>

  <header class="reader-topbar" id="reader-topbar">
    <button class="icon-btn" id="reader-back" aria-label="Kembali">&#8592;</button>
    <div class="reader-title">
      <span id="reader-book-title"></span>
      <span id="reader-chapter-label"></span>
    </div>
    <button class="icon-btn" id="reader-listen-btn" aria-label="Dengarkan bab ini">&#127911;</button>
    <button class="icon-btn" id="reader-settings-btn" aria-label="Pengaturan tampilan">Aa</button>
  </header>

  <div class="reader-settings" id="reader-settings" hidden>
    <div class="rs-row">
      <span class="rs-label">Ukuran</span>
      <div class="rs-group">
        <button class="rs-btn" id="font-dec" aria-label="Perkecil huruf">A&#8722;</button>
        <button class="rs-btn" id="font-inc" aria-label="Perbesar huruf">A+</button>
      </div>
    </div>
    <div class="rs-row">
      <span class="rs-label">Tema</span>
      <div class="rs-group">
        <button class="theme-dot theme-dot-light" data-theme="terang" aria-label="Tema terang"></button>
        <button class="theme-dot theme-dot-sepia" data-theme="sepia" aria-label="Tema sepia"></button>
        <button class="theme-dot theme-dot-dark" data-theme="gelap" aria-label="Tema gelap"></button>
      </div>
    </div>
  </div>

  <div class="pager" id="pager">
    <article class="reader-content" id="reader-content"></article>
  </div>

  <nav class="reader-nav" id="reader-nav">
    <button class="nav-btn" id="page-prev" aria-label="Halaman sebelumnya">&#8592;</button>
    <button class="nav-btn nav-pos" id="page-pos" aria-label="Posisi baca, buka daftar bab">Hal 1/1</button>
    <button class="nav-btn" id="page-next" aria-label="Halaman berikutnya">&#8594;</button>
  </nav>

  <div class="toc-sheet" id="toc-sheet" hidden>
    <div class="toc-inner">
      <div class="toc-head">
        <h2>Daftar Bab</h2>
        <button class="icon-btn" id="toc-close" aria-label="Tutup">&#10005;</button>
      </div>
      <ol id="toc-list"></ol>
    </div>
  </div>
</main>

<!-- ===== VIEW: DENGARKAN (podcast) ===== -->
<main id="view-listen" class="view listen" hidden>
  <header class="listen-topbar">
    <button class="icon-btn" id="listen-back" aria-label="Kembali">&#8592;</button>
    <div class="listen-headtitle">Mendengarkan</div>
    <button class="icon-btn" id="listen-voice-btn" aria-label="Pilih suara">&#9881;</button>
  </header>

  <div class="listen-hero">
    <div class="listen-cover" id="listen-cover"></div>
    <h2 id="listen-book"></h2>
    <p id="listen-chapter"></p>
    <p class="listen-engine" id="listen-engine"></p>
  </div>

  <div class="listen-live" id="listen-live"></div>

  <div class="listen-seek" id="listen-seek-wrap" hidden>
    <input type="range" id="listen-seek" min="0" max="1000" value="0" aria-label="Posisi audio">
    <div class="listen-time"><span id="listen-cur">0:00</span><span id="listen-dur">0:00</span></div>
  </div>

  <div class="listen-controls">
    <button class="lc-btn" id="listen-prevch" aria-label="Bab sebelumnya">&#9198;</button>
    <button class="lc-btn" id="listen-rew" aria-label="Mundur">&#8630;15</button>
    <button class="lc-main" id="listen-play" aria-label="Putar / jeda">&#9654;</button>
    <button class="lc-btn" id="listen-ffw" aria-label="Maju">15&#8631;</button>
    <button class="lc-btn" id="listen-nextch" aria-label="Bab berikutnya">&#9197;</button>
  </div>

  <div class="listen-row2">
    <button class="chip2" id="listen-speed">1.0&#215;</button>
    <button class="chip2" id="listen-sleep">Timer: Off</button>
    <button class="chip2" id="listen-chlist">Daftar Bab</button>
  </div>

  <div class="voice-sheet" id="voice-sheet" hidden>
    <div class="voice-inner">
      <div class="toc-head"><h2>Pilih Suara</h2><button class="icon-btn" id="voice-close">&#10005;</button></div>
      <div id="voice-list"></div>
    </div>
  </div>

  <audio id="audio-el" preload="metadata"></audio>
</main>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
